name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: dropdown
    id: deployment
    attributes:
      label: Relevant deployment type
      multiple: true
      options:
        - Self-hosted (Docker / Node)
        - Firebase (App Hosting + Firestore + Storage)
        - Both / does not matter
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do (e.g. "share wedding photos with 80 guests")?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself (see CONTRIBUTING.md)
