# Wayfare — self-hosted stack.
#   cp .env.example .env   # set WAYFARE_SECRET (32+ chars), WAYFARE_BASE_URL, WAYFARE_ADMIN_EMAILS
#   docker compose up -d
#
# Optional profiles:
#   docker compose --profile cron  up -d   # daily digest e-mails (needs CRON_SECRET in .env)
#   docker compose --profile minio up -d   # local S3 (MinIO) for testing STORAGE_DRIVER=s3

services:
  wayfare:
    build: .
    image: wayfare:local
    restart: unless-stopped
    env_file: .env
    environment:
      WAYFARE_RUNTIME: selfhost
      DATA_DIR: /data
    volumes:
      - wayfare-data:/data
    ports:
      - "3000:3000"

  # Calls the digest endpoint once a day (see docs: Operator guide -> Mail / Notifications).
  cron:
    profiles: ["cron"]
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    depends_on:
      - wayfare
    environment:
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sleep 86400
          curl -fsS -X POST -H "Authorization: Bearer $$CRON_SECRET" http://wayfare:3000/api/cron/digest || echo "digest call failed"
        done

  # S3-compatible storage for testing. Console: http://localhost:9001 (wayfare / wayfare-secret)
  # In .env: STORAGE_DRIVER=s3  S3_ENDPOINT=http://minio:9000  S3_BUCKET=wayfare
  #          S3_ACCESS_KEY_ID=wayfare  S3_SECRET_ACCESS_KEY=wayfare-secret  S3_FORCE_PATH_STYLE=true
  minio:
    profiles: ["minio"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: wayfare
      MINIO_ROOT_PASSWORD: wayfare-secret
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    profiles: ["minio"]
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 wayfare wayfare-secret; do sleep 1; done
        mc mb --ignore-existing local/wayfare

volumes:
  wayfare-data:
  minio-data:
